# ⚠️ ESTE ARQUIVO NÃO É A FONTE DE VERDADE (24/set/2026).
# O serviço da Render foi criado pelo painel, não por Blueprint, então ele NÃO
# lê este arquivo — serve de referência e de base caso um dia o serviço seja
# recriado. Diferenças reais hoje: o serviço está no plano `starter` (pago) e
# com buildCommand `pip install -r requirements.txt`. Mudança de configuração
# tem que ser feita no painel; mudar só aqui não tem efeito nenhum.
services:
  - type: web
    name: padmini
    env: python
    plan: starter
    buildCommand: bash build.sh
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Valores definidos no dashboard da Render (sync: false = não versionado aqui).
      - key: PADMINI_CONTEUDO_TOKEN  # token de leitura do repo privado nicki-arch/padmini-conteudo (ver build.sh)
        sync: false
      - key: ANTHROPIC_API_KEY   # texto por IA (opcional)
        sync: false
      - key: PADMINI_SECRET      # obrigatório: assina os tokens do completo
        sync: false
      - key: PADMINI_SITE_URL    # base dos links de entrega
        sync: false
      - key: PADMINI_CAKTO_WEBHOOK_SECRET   # verifica a origem do webhook
        sync: false
      - key: PADMINI_CAKTO_PROD_MAPA        # id do produto mapa na Cakto
        sync: false
      - key: PADMINI_CAKTO_PROD_COMPAT      # id do produto compat na Cakto
        sync: false
      - key: PADMINI_CAKTO_OFERTA_BUMP_MAPAS  # código da oferta do bump "casal + 2 mapas" (ou no ofertas.yaml)
        sync: false
      - key: PADMINI_CAKTO_EXIGIR_ASSINATURA  # 1 = só aceita webhook com assinatura no header (ver docs/seguranca.md)
        sync: false
      - key: RESEND_API_KEY      # envio do e-mail de entrega (opcional)
        sync: false
      - key: PADMINI_EMAIL_FROM  # remetente do e-mail
        sync: false
      - key: DATABASE_URL        # Postgres (Supabase ou Render). Em branco = sem banco
        sync: false
      - key: PADMINI_CAPTURA       # 1 = site travado na lista de espera
        sync: false
      - key: PADMINI_PREVIA_CHAVE  # libera o site travado com ?previa=
        sync: false
      - key: PADMINI_DATA_ABERTURA # ex.: "10 de outubro"
        sync: false
      - key: PADMINI_LIVE_SENHA   # senha do modo live (/live). Em branco = modo live desligado
        sync: false
      - key: PADMINI_POSTHOG_KEY # métricas de funil (opcional; em branco = desligado)
        sync: false
