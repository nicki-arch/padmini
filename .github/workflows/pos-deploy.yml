# Confere o site de verdade depois de cada deploy (e uma vez por dia).
#
# A Render publica sozinha depois que os testes passam na master, mas ninguém
# rodava o scripts/smoke_producao.py depois (regra 7 do CLAUDE.md). Aqui:
#   1. espera o /api/saude mostrar a versão (commit) nova no ar;
#   2. roda o smoke contra padmini.com.br.
# Se falhar, o GitHub manda e-mail para o dono do repositório (é o padrão de
# notificação de workflow com falha — confira em github.com/settings/notifications).
name: pos-deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: "43 12 * * *"   # 09:43 em Brasília
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Esperar a versão nova entrar no ar
        if: github.event_name == 'push'
        run: |
          alvo="${GITHUB_SHA::7}"
          # CI (~1 min) + build e troca de instância na Render (~2 min); margem larga.
          for i in $(seq 1 50); do
            versao=$(curl -s --max-time 60 https://padmini.onrender.com/api/saude \
                     | python -c "import sys,json; print(json.load(sys.stdin).get('versao',''))" 2>/dev/null || true)
            echo "tentativa $i: no ar = '${versao}', esperado = '${alvo}'"
            if [ "$versao" = "$alvo" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::A versão $alvo não entrou no ar em 25 minutos. Veja o deploy na Render."
          exit 1
      - name: Smoke de produção
        run: |
          pip install -q pyyaml
          python scripts/smoke_producao.py https://padmini.com.br
