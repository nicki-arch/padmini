# Confere o site de verdade, de hora em hora.
#
# NÃO roda no push de propósito: a Render está em "Auto-Deploy: After CI
# Checks Pass" e espera TODAS as verificações do commit passarem. Um workflow
# de push que esperasse o deploy travaria o próprio deploy (aconteceu em
# 25/set: um esperava o outro).
#
# Em cada rodada:
#   1. se o commit mais novo da master tem mais de 30 min e ainda não está no ar
#      (/api/saude → versao), falha: o deploy travou ou quebrou na Render;
#   2. roda o scripts/smoke_producao.py contra padmini.com.br.
# Se falhar, o GitHub manda e-mail para o dono do repositório (padrão de
# notificação de workflow com falha — confira em github.com/settings/notifications).
name: pos-deploy

on:
  schedule:
    - cron: "43 * * * *"   # de hora em hora, no minuto 43
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: A versão mais nova da master está no ar?
        run: |
          alvo="${GITHUB_SHA::7}"
          idade=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          versao=""
          for i in 1 2 3; do
            versao=$(curl -s --max-time 90 https://padmini.onrender.com/api/saude \
                     | python -c "import sys,json; print(json.load(sys.stdin).get('versao',''))" 2>/dev/null) && break
            sleep 20
          done
          echo "no ar: '${versao}' · master: '${alvo}' · commit tem $((idade / 60)) min"
          if [ "$versao" != "$alvo" ] && [ "$idade" -gt 1800 ]; then
            echo "::error::A master ($alvo) tem mais de 30 min e o site ainda roda '$versao'. Veja o deploy na Render."
            exit 1
          fi
      - name: Smoke de produção
        run: |
          pip install -q pyyaml
          python scripts/smoke_producao.py https://padmini.com.br
