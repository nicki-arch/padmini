# Roda a suíte de testes em todo push e pull request.
# Com o Render configurado em "Auto-Deploy: After CI Checks Pass", um commit que
# quebra os testes NÃO vai para o ar.
name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: padmini_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:teste@localhost:5432/padmini_teste
      PADMINI_CONTEUDO_TOKEN: ${{ secrets.CONTEUDO_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # O conteúdo proprietário mora no repositório PRIVADO nicki-arch/padmini-conteudo
      # (rodada 10). Transição (fases 1 e 2): o clone prova que o secret funciona; o
      # que já estiver lá substitui o arquivo do checkout, e o que ainda não estiver
      # segue com o do checkout. A fase 3 tira este fallback (sem o conteúdo, falha).
      - name: Buscar conteúdo privado (transição)
        if: ${{ env.PADMINI_CONTEUDO_TOKEN != '' }}
        run: |
          git clone --depth 1 "https://x-access-token:${PADMINI_CONTEUDO_TOKEN}@github.com/nicki-arch/padmini-conteudo.git" /tmp/padmini-conteudo
          echo "OK: o secret CONTEUDO_REPO_TOKEN clonou o repositório privado."
          if [ -f /tmp/padmini-conteudo/base_significacoes.py ]; then
            cp /tmp/padmini-conteudo/base_significacoes.py ./base_significacoes.py
          else
            echo "Repo privado ainda sem base_significacoes.py: usando o do checkout (transição)."
          fi
          for pasta in conteudo/ocidental/textos conteudo/ocidental/blog; do
            if [ -d "/tmp/padmini-conteudo/$pasta" ]; then
              rm -rf "./$pasta" && mkdir -p "./$pasta" && cp -R "/tmp/padmini-conteudo/$pasta/." "./$pasta/"
            fi
          done
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q testes
