# Roda a suíte de testes em todo push e pull request.
# Com o Render configurado em "Auto-Deploy: After CI Checks Pass", um commit que
# quebra os testes NÃO vai para o ar.
name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: padmini_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:teste@localhost:5432/padmini_teste
      PADMINI_CONTEUDO_TOKEN: ${{ secrets.CONTEUDO_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # O conteúdo proprietário (textos de interpretação) mora no repositório PRIVADO
      # nicki-arch/padmini-conteudo (rodada 10). O mesmo script do build.sh traz os
      # arquivos; sem o secret, o job FALHA (segurança falha fechada) — exceto em PR de
      # fork, que nunca recebe secrets: aí roda só o que não depende do conteúdo e o log
      # diz, com um aviso, que o resto ficou de fora.
      - name: Buscar conteúdo privado
        id: conteudo
        env:
          DE_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$PADMINI_CONTEUDO_TOKEN" ] && [ "$DE_FORK" = "true" ]; then
            echo "::warning::PR de fork: sem acesso ao repositório privado de conteúdo. Os testes que dependem dos textos NÃO rodam; só os que não dependem (conteúdo fora do repositório, licença)."
            echo "fork=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/buscar_conteudo.sh
      - run: pip install -r requirements.txt pytest httpx
      - name: Testes
        if: ${{ steps.conteudo.outputs.fork != 'true' }}
        run: python -m pytest -q testes
      - name: Testes sem o conteúdo (PR de fork)
        if: ${{ steps.conteudo.outputs.fork == 'true' }}
        run: python -m pytest -q testes/test_conteudo_fora_do_repo.py testes/test_licenca.py
