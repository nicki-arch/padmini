# RASCUNHO escrito pelo Claude Code (round 5) para a família revisar.
# Só vai ao ar com `revisado: true`.
titulo: Mapa natal não é horóscopo
descricao: >-
  O horóscopo do jornal usa só o signo do Sol. O mapa natal usa o céu inteiro
  do seu nascimento. Entenda a diferença e por que a hora importa.
data: 2026-09-27
revisado: false
abertura: >-
  "Sou de Touro" diz alguma coisa — mas muito pouco. O horóscopo parte só do
  signo em que o Sol estava quando você nasceu, e fala igual com todo mundo que
  nasceu no mesmo mês. O mapa natal parte do céu inteiro daquele momento.
secoes:
  - titulo: O céu de um instante
    paragrafos:
      - >-
        O mapa natal mostra onde estavam o Sol, a Lua, Mercúrio, Vênus, Marte,
        Júpiter, Saturno e os planetas mais lentos no minuto e no lugar do seu
        nascimento. Cada um fala de uma parte de você: o Sol, do jeito de
        brilhar; a Lua, do jeito de sentir; Vênus, do jeito de amar.
      - >-
        Por isso duas pessoas do mesmo signo podem ser tão diferentes: o Sol
        pode ser o mesmo, mas a Lua, o Ascendente e os outros planetas quase
        nunca são.
  - titulo: Por que a hora importa
    paragrafos:
      - >-
        A hora define o Ascendente — o signo que subia no horizonte — e as doze
        casas, que mostram em que áreas da vida cada planeta se expressa. Em
        cerca de duas horas o Ascendente muda de signo.
      - >-
        Sem a hora, dá para fazer o mapa assim mesmo: os planetas nos signos e
        os aspectos entre eles continuam lá. Ficam de fora o Ascendente e as
        casas, e uma boa leitura avisa isso.
  - titulo: Tendências, não sentenças
    paragrafos:
      - >-
        Um mapa natal não diz o que vai acontecer com você. Ele descreve
        tendências — jeitos de reagir, de desejar, de se proteger — que você
        pode reconhecer, questionar e usar a seu favor. É uma ferramenta de
        autoconhecimento, não uma previsão.
chamada:
  texto: A amostra do seu mapa natal é grátis — Sol, Lua e Ascendente, na hora.
  botao: Fazer meu mapa natal →
  href: /mapa
