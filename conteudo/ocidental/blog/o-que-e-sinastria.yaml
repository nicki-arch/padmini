# RASCUNHO escrito pelo Claude Code (round 5) para a família revisar.
# Só vai ao ar com `revisado: true`.
titulo: O que é sinastria (e o que ela não é)
descricao: >-
  Sinastria é o encontro de dois mapas natais. Veja como ela funciona, o que
  ela olha em um casal e por que não é um veredito sobre a relação.
data: 2026-09-27
revisado: false
abertura: >-
  Quando duas pessoas se encontram, dois céus se encontram junto. A sinastria é
  a parte da astrologia que coloca o mapa natal de uma pessoa sobre o da outra
  e observa onde os planetas de um tocam os planetas do outro.
secoes:
  - titulo: Dois mapas, um encontro
    paragrafos:
      - >-
        Cada mapa natal é uma fotografia do céu no momento e no lugar de um
        nascimento: onde estavam o Sol, a Lua e os planetas, e qual signo
        subia no horizonte (o Ascendente). Na sinastria, não se lê um mapa de
        cada vez — lê-se o diálogo entre os dois.
      - >-
        Esse diálogo aparece nos aspectos: os ângulos entre um planeta de uma
        pessoa e um planeta da outra. Um trígono ou um sextil costumam falar de
        facilidade; uma quadratura ou uma oposição, de atrito — que pode ser
        desconforto, mas também movimento e atração.
  - titulo: O que a sinastria olha
    paragrafos:
      - >-
        Alguns encontros dizem mais sobre a vida a dois do que outros. A Lua de
        um com a Lua do outro fala do jeito de sentir e de se acolher. Vênus e
        Marte falam de atração e desejo. Mercúrio, da conversa. Saturno, do
        compromisso e do longo prazo.
      - >-
        Quando as duas pessoas sabem a hora de nascimento, entram também as
        casas: em que área da vida de um os planetas do outro caem. É daí que
        vem boa parte da leitura sobre a convivência e o dia a dia.
  - titulo: O que a sinastria não é
    paragrafos:
      - >-
        Não é uma sentença. Nenhum aspecto decide se uma relação vai dar certo:
        quem decide são as duas pessoas, com as escolhas que fazem todos os
        dias. Um ponto de tensão no mapa é um lugar para prestar atenção, não
        um aviso de fim.
      - >-
        Também não é a combinação de signos solares das revistas. "Leão com
        Escorpião" olha um planeta de cada lado; a sinastria olha todos, com o
        grau exato de cada um.
chamada:
  texto: A amostra da sinastria de vocês é grátis e sai na hora.
  botao: Ver nossa sinastria →
  href: /compatibilidade
