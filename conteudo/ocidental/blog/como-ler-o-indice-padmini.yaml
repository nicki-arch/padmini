# RASCUNHO escrito pelo Claude Code (round 5) para a família revisar.
# Os números do método batem com docs/ocidental.md (sinastria.py). Só vai ao ar
# com `revisado: true`.
titulo: Como ler o Índice Padmini
descricao: >-
  O Índice Padmini resume a sinastria de um casal num número de 0 a 100. Veja
  como ele é calculado, o que um número alto e um baixo querem dizer — e o que
  eles não querem dizer.
data: 2026-09-27
revisado: false
abertura: >-
  A astrologia tradicional não tem uma nota única para casais. O Índice Padmini
  é um método nosso, e por isso a gente mostra como ele é feito — para que o
  número ajude a conversa, e não a substitua.
secoes:
  - titulo: Oito dimensões, um número
    paragrafos:
      - >-
        A sinastria da Padmini organiza o encontro dos dois mapas em oito
        dimensões: Atração, Emoções, Comunicação, Afeto e valores, Identidade,
        Crescimento, Compromisso e Dia a dia. Cada uma olha para planetas
        diferentes — Vênus e Marte na atração, a Lua nas emoções, Saturno no
        compromisso.
      - >-
        Cada dimensão recebe uma nota de 0 a 100. O 50 é o ponto neutro: é a
        nota de uma dimensão sem nenhum aspecto entre os planetas que ela olha.
        Aspectos de facilidade empurram a nota para cima; aspectos de tensão,
        para baixo; e quanto mais exato o aspecto, mais ele pesa.
      - >-
        O Índice é a média dessas oito notas, com um peso um pouco maior para
        Emoções, Afeto e Compromisso — as dimensões que mais falam da vida a
        dois no longo prazo. Se ninguém sabe a hora de nascimento, a dimensão
        Dia a dia fica de fora da conta, e o relatório avisa.
  - titulo: Número alto, número baixo
    paragrafos:
      - >-
        Um índice alto quer dizer que, no geral, os planetas de vocês conversam
        com facilidade. Não quer dizer que a relação vai se cuidar sozinha:
        facilidade também pode virar acomodação.
      - >-
        Um índice baixo quer dizer que vocês são diferentes em coisas que
        importam. Diferença pede atenção e acordo — e muitos casais constroem
        justamente aí o que têm de mais forte.
  - titulo: Onde olhar primeiro
    paragrafos:
      - >-
        Mais do que o número final, vale olhar a forma da rosa: quais dimensões
        fluem e quais pedem cuidado. O ponto mais forte é onde vocês podem se
        apoiar; o ponto de atenção é onde uma conversa honesta costuma render
        mais.
chamada:
  texto: Vejam o Índice Padmini de vocês, com o ponto mais forte e o de atenção.
  botao: Ver nossa sinastria →
  href: /compatibilidade
