# Página da sinastria (versão ocidental). Quase toda a copy está no HTML
# (static/ocidental/compatibilidade.html) e em textos/sinastria.yaml.

card:
  # Decisão do Nicolas (26/set/2026): o card compartilhável mostra o Índice
  # Padmini, sempre com o rótulo "ÍNDICE PADMINI · MÉTODO PRÓPRIO". O relatório
  # também mostra, com o método explicado.
  mostra_indice: true

# "Como fica o relatório completo" (round 5): um casal de exemplo com
# nascimentos fictícios (exemplos_ocidental.py), a rosa e a comparação.
como_fica:
  titulo: Como fica o relatório completo
  sub: >-
    Um exemplo com nascimentos fictícios — {a} &amp; {b} —, calculado pelo
    mesmo método que vai calcular o de vocês.
  rosa_legenda: >-
    A rosa das oito dimensões: cada pétala é uma dimensão; quanto maior, mais o
    encontro flui ali. A pétala colorida é o ponto mais forte.
  trecho_titulo: Um trecho do completo
  mais: >-
    E segue assim pelas oito dimensões, com os aspectos entre os planetas de
    vocês, um a um, e os planetas de um nas casas do outro.
  comparacao:
    - item: O Índice Padmini e o que ele diz sobre vocês
      amostra: true
    - item: O ponto mais forte e o ponto de atenção
      amostra: true
    - item: O card para compartilhar
      amostra: true
    - item: A rosa e as 8 dimensões, com a nota e a leitura de cada uma
      amostra: false
    - item: Os aspectos entre os planetas de vocês, um a um
      amostra: false
    - item: Os planetas de um nas casas do outro
      amostra: false
