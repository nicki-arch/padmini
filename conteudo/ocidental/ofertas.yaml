# Padmini (versão OCIDENTAL) — preços e links de checkout. FONTE ÚNICA.
#
# Mesmo formato do conteudo/vedica/ofertas.yaml. Estas ofertas são OUTRAS na
# Cakto (o código no link é o que diz ao webhook que a compra foi da versão
# ocidental). Enquanto `checkout` estiver vazio, o botão de compra fica
# desativado ("em breve") e o webhook não reconhece nada desta versão.
#
# Para ligar: criar a oferta na Cakto, colar aqui o link de Produto → Checkout
# e fazer o deploy (é um PR comum). Só depois trocar PADMINI_SISTEMA.

mapa:
  nome: Mapa Natal completo
  preco: 47
  checkout: ""

# `preco` é o de tabela, o que a página mostra por padrão e o que a oferta
# cobra na Cakto (o smoke confere). `preco_cupom` só aparece para quem chega
# com cupom de afiliado no link (?cupom=CODIGO); a página manda o código para
# a Cakto no parâmetro `coupon`, que aplica o desconto no checkout. O cupom
# (R$30 fixo) precisa existir na Cakto com o mesmo código.
compat:
  nome: Sinastria do casal
  preco: 127
  preco_cupom: 97
  checkout: ""
