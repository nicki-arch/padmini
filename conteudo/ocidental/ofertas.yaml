# Padmini (versão OCIDENTAL) — preços e links de checkout. FONTE ÚNICA.
#
# Mesmo formato do conteudo/vedica/ofertas.yaml. Estas ofertas são OUTRAS na
# Cakto (o código no link é o que diz ao webhook que a compra foi da versão
# ocidental). Enquanto `checkout` estiver vazio, o botão de compra fica
# desativado ("em breve") e o webhook não reconhece nada desta versão.
#
# Para ligar: criar a oferta na Cakto, colar aqui o link de Produto → Checkout
# e fazer o deploy (é um PR comum). Só depois trocar PADMINI_SISTEMA.
# Links colados em 26/set/2026 (rodada 3).

# Taxa que a Cakto soma no checkout, por compra. Não é oferta: o ofertas.py a
# põe em cada oferta (`taxa_plataforma`) e o bloco de preço mostra "+ R$0,99 de
# taxa da plataforma" ao lado do preço (rodada visual, fase B). Mudou na Cakto?
# Só aqui.
taxa_plataforma: 0.99

# Preços decididos pelo Nicolas em 26/set/2026 (rodada 2).
mapa:
  nome: Mapa Natal completo
  preco: 37
  checkout: "https://pay.cakto.com.br/39vm3n6_1141264"

# `preco` é o de tabela, o que a página mostra por padrão e o que a oferta
# cobra na Cakto (o smoke confere).
#
# Cupom: a Cakto só aceita desconto em % inteiro. O preço com cupom NÃO é
# escrito aqui: o ofertas.py calcula de `cupom_percentual` (127 − 24% = 96,52),
# para nunca divergir do que a Cakto cobra. Ele só aparece para quem chega com
# um dos `cupom_codigos` no link (?cupom=PEDRO, sem diferença de maiúsculas);
# a página manda o código (em minúsculas, como a Cakto grava) no parâmetro
# `coupon`, que aplica o desconto no checkout. O cupom vale só para a
# sinastria, não para o bump. Cupom `pedro` criado pelo Nicolas em 26/set/2026.
compat:
  nome: Sinastria do casal
  preco: 127
  cupom_percentual: 24
  cupom_codigos: [pedro]
  checkout: "https://pay.cakto.com.br/hrf7qtu_1141270"

# Order bump do checkout da sinastria: casal + o mapa natal de cada um. Não
# tem checkout próprio: aparece dentro do checkout da sinastria (`bump_de`),
# desmarcado, por R$40. `preco` é o TOTAL do combo (127 + 40); a página
# anuncia a diferença para o preço de tabela da sinastria ("por mais R$40").
# O link serve para o webhook reconhecer o bump pelo código da oferta.
bump_mapas_casal:
  nome: Casal completo (sinastria + 2 mapas natais)
  preco: 167
  bump_de: compat
  checkout: "https://pay.cakto.com.br/32vnvwx_1144252"

numerologia:
  nome: Numerologia completa
  preco: 27
  checkout: "https://pay.cakto.com.br/3by9kh8_1141279"

# Parcela em até 4x (limite da Cakto para R$19); as páginas não anunciam parcelas.
tarot:
  nome: Tarot — tiragem de 3 cartas
  preco: 19
  checkout: "https://pay.cakto.com.br/hzxu8hh_1141288"
