# Valderez Astrologia (versão OCIDENTAL) — texto da lista de espera (/lista). FONTE ÚNICA da
# copy desta página, inclusive o <head>. O desenho está em static/ocidental/lista.html.
# Rodada 6.1 (29/set): com PADMINI_CAPTURA=1 esta é a única página aberta; quem
# chega vem dos vídeos da Dona Valderez revisando os textos. O mapa natal é a
# porta de entrada (como na home); a sinastria vem em segundo.
# 29/set (rodada visual): a marca pública da ocidental passa a ser Valderez
# Astrologia; o desenho segue docs/design/valderez-1.0/telas/lista.html.
# Sem preço aqui de propósito: a condição de quem está na lista é anunciada no
# lançamento (sem prometer valor nem percentual). Preço, se voltar, só de
# conteudo/ocidental/ofertas.yaml — e a Cakto soma R$0,99 de taxa no checkout.

seo:
  titulo: Valderez Astrologia — Lista de espera
  # a descrição para buscador mora em revisao.yaml (lista_seo): fala da revisão
  # da Dona Valderez e só diz "revisados" quando for verdade (rodada 9)
  og_titulo: O seu mapa natal — Valderez Astrologia
  og_descricao: Estamos abrindo. Entre na lista e seja avisado primeiro.

hero:
  eyebrow: Valderez Astrologia · lista de espera
  titulo: O céu de quando você <em>nasceu</em>, lido com cuidado. Está quase abrindo.
  lede: >-
    O seu mapa natal: o Sol, a Lua, o Ascendente e cada planeta, calculados
    para a data, a hora e a cidade do seu nascimento. E, se quiser, a sinastria
    do casal — o que os mapas de vocês dois dizem juntos. Entre na lista e seja
    avisado primeiro.

beneficios:
  - titulo: Aviso no dia da abertura
    texto: Você fica sabendo antes de todo mundo, por e-mail (e pelo WhatsApp, se quiser).
  - titulo: Condição especial para quem está na lista
    texto: No lançamento, quem entrou na lista tem uma condição de fundador. Os detalhes chegam no aviso da abertura.
  - titulo: Amostra grátis, como sempre
    texto: Você vê o seu Sol, a sua Lua e o seu Ascendente antes de decidir qualquer coisa.

# O destaque sobre a Dona Valderez mora em revisao.yaml (lista_titulo, lista_texto):
# regra de honestidade da rodada 9.

formulario:
  titulo: Seja avisado primeiro
  interesse: O que mais te interessa?
  # As opções e a ordem vêm do catálogo (catalogo.yaml, produtos ativos e em breve);
  # aqui, só o rótulo (sem rótulo, vale o nome do produto).
  opcoes:
    mapa: Meu mapa natal
    compat: Sinastria do casal
  aceita_email: Quero receber por e-mail o aviso da abertura e a condição de quem está na lista.
  aceita_whatsapp: Também quero o aviso pelo WhatsApp.
  ajuda_whatsapp: Só mandamos mensagem se você marcar a caixa do WhatsApp abaixo.
  botao: Entrar na lista
  miudo: >-
    Usamos seus dados só para avisar da abertura e das novidades da Valderez
    Astrologia.
    Você sai da lista quando quiser.

pronto:
  titulo: Pronto, você está na lista.
  texto: Vamos te avisar assim que abrir. Enquanto isso, chama quem você quer ver o resultado junto.
  compartilhar: Compartilhar a lista
  texto_compartilhar: "O mapa natal, lido com cuidado — entra na lista comigo:"
