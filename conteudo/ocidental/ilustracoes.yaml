# Valderez Astrologia (versão OCIDENTAL) — ILUSTRAÇÕES TROCÁVEIS (rodada 9).
#
# Cada imagem é uma VAGA com nome fixo (hero-home, dim-sol, capa-tarot,
# signo-touro…) dentro de um CONJUNTO (static/ilustracoes/<conjunto>/<vaga>.webp).
# Templates, e-mail e PDF pedem a vaga (ilustracoes.py: `ilustracao("dim-sol")`,
# `url("dim-sol")`), nunca o arquivo. Vaga que faltar no conjunto ativo cai no
# reserva; se nenhum tiver, sai um fundo liso na cor papel (nunca imagem quebrada).
#
# Para trocar o estilo: entregar static/ilustracoes/<conjunto-novo>/ com os
# mesmos nomes (WebP), rodar `python scripts/checar_ilustracoes.py <conjunto-novo>`
# e trocar `conjunto_ativo` aqui. Nada de texto dentro das imagens.
# Especificação completa: claude/especificacao-ilustracoes.md (no Project).
#
# `proporcao` é conferida com 2% de folga; `minimo` é o menor tamanho aceito
# (o do conjunto entregue em 5/out); cada arquivo tem de ter menos de 300 KB.
# As vagas foto-valderez-* (fotos, não ilustração) ainda não foram fotografadas:
# o site mostra a roda no lugar.

conjunto_ativo: aquarela-2026
conjunto_reserva: aquarela-2026
conjuntos:
  aquarela-2026: {origem: "ChatGPT (imagem)", data: 2026-10-02, licenca: "conferir os termos de uso do ChatGPT"}

