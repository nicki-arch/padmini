# Valderez Astrologia (versão OCIDENTAL) — texto da home. FONTE ÚNICA da copy desta página,
# inclusive o <head> (título e descrição para buscador e redes).
# Rodada 9 (5/out/2026): desenho do pacote valderez-design-2.0 (telas Site-Home e
# Site-Home-celular), em static/ocidental/home.html. Os produtos e as dimensões
# vêm do catálogo (conteudo/ocidental/catalogo.yaml); o preço, do ofertas.yaml.
# Frases sobre a revisão da Dona Valderez: revisao.yaml (regra de honestidade).
# Onde há `_venda` e `_fechada`, vale a primeira com a venda aberta e a segunda
# com vendas_abertas: false.

seo:
  titulo: Valderez Astrologia — Astrologia para autoconhecimento
  descricao: >-
    Mapa natal, sinastria do casal, numerologia e tarot. Astrologia para
    autoconhecimento, com amostra grátis em todos.
  og_titulo: O seu mapa natal — Valderez Astrologia
  og_descricao: O Sol, a Lua e o Ascendente de quando você nasceu. Amostra grátis.

hero:
  titulo: O céu de quando você <em>nasceu</em>, lido com cuidado.
  lede: >-
    Não é horóscopo de signo. O seu mapa natal mostra onde estavam o Sol, a Lua
    e cada planeta no momento exato em que você nasceu, e o que isso diz de você.
  rotulo_data: Quando você nasceu?
  botao: Ver meu mapa grátis
  selos_venda: ["Amostra grátis, na hora", Entrega imediata, Pix ou cartão]
  selos_fechada: ["Amostra grátis, na hora", Sem cadastro nem senha, O resto chega no seu e-mail]

dimensoes:
  olho: O que o seu mapa mostra
  titulo: Seu mapa, <em>dimensão</em> por dimensão
  sub: >-
    Cada dimensão olha para um planeta ou ponto do seu mapa. Novas dimensões
    chegam ao seu mapa completo sem custo extra.

passos:
  - titulo: Seu nascimento
    texto: Data, hora e cidade. Sem a hora também dá.
  - titulo: A amostra grátis
    texto: Na hora, o começo de cada dimensão do seu mapa.
  - titulo: O mapa completo
    texto_venda: Se quiser ir fundo, desbloqueie tudo e receba no e-mail.
    texto_fechada: A leitura completa abre em breve; quem pedir é avisado primeiro.

recebe:
  olho: O que você recebe
  titulo: Um relatório completo, <em>claro</em> e só seu
  mockup_alt: Capa e páginas do relatório do mapa natal
  olho_caixa: Mapa natal completo
  pagamento_unico: pagamento único
  itens:
    - As 6 dimensões completas, com o texto de cada posição
    - A roda do seu mapa, casas e aspectos
    - Novas dimensões entram no seu mapa sem custo
    - PDF para guardar, no seu e-mail
  botao: Ver minha amostra grátis
  pagamento: Pix ou cartão · pagamento seguro pela Cakto
  abre_em_breve: A leitura completa abre em breve. Comece pela amostra grátis.

quem:
  olho: Quem revisa
  nome: Dona Valderez
  sobre: É ela quem aparece nos vídeos explicando signo por signo, ao lado do neto, Pedro.

em_breve:
  olho: Outras leituras
  titulo: Chegando em breve

# Só aparece com depoimento real e autorizado (conteudo/ocidental/depoimentos.yaml).
depoimentos:
  titulo: O que dizem

faq:
  titulo: Perguntas <em>frequentes</em>
  # `revisao: <chave>` = a resposta vem de revisao.yaml (a versão que é verdade hoje);
  # `so_com_venda: true` = some com a venda fechada.
  itens:
    - pergunta: É a mesma coisa que horóscopo?
      resposta: >-
        Não. O horóscopo usa só o signo do Sol. O mapa natal parte da data, da
        hora e da cidade do seu nascimento e mostra onde estava cada planeta
        naquele momento.
    - pergunta: Preciso saber a hora em que nasci?
      resposta: >-
        Ajuda muito: a hora define o Ascendente e as casas. Sem ela, você recebe
        o mapa com Sol, Lua e planetas, e a gente avisa o que fica de fora.
    - pergunta: Quem escreve os textos?
      revisao: faq_textos
    - pergunta: Como recebo o mapa completo?
      so_com_venda: true
      resposta: >-
        Logo depois do pagamento: o link chega no seu e-mail, com o PDF para
        guardar.
    - pergunta: Como pago?
      so_com_venda: true
      resposta: Pix ou cartão de crédito, num pagamento seguro processado pela Cakto.
    - pergunta: Quando abre a leitura completa?
      so_sem_venda: true
      resposta: >-
        Em breve. Faça a sua amostra grátis agora e, se quiser, peça para ser
        avisado: quem pede recebe o aviso primeiro.

fechamento:
  titulo: O seu céu, lido <em>com cuidado</em>.
  sub: Veja o começo de cada dimensão do seu mapa agora, de graça.
  botao: Ver meu mapa grátis
