# Valderez Astrologia (versão OCIDENTAL) — CATÁLOGO.
#
# RODADA 15: o YAML é o PADRÃO; quem manda no ar é o /painel (docs/painel.md). O
# `estado` de cada produto e o `vendas_abertas` daqui valem só enquanto o painel não
# salvou outro valor para aquela chave (estado_site.py). Nome, rota, ordem, oferta e as
# dimensões continuam só aqui.
#
# Rodada 9 (5/out/2026). Liberar ou esconder um produto é mudar o `estado` dele
# aqui (uma linha) e fazer o deploy — sem mexer em HTML. O catálogo diz:
#   - o que aparece no menu, na home, no rodapé, no sitemap e em "Todas as leituras";
#   - qual página cada rota mostra;
#   - se o site vende (`vendas_abertas`).
#
# Estados:
#   ativo     aparece em todo lugar, com a página do produto funcionando
#   em_breve  aparece com "em breve"; a página mostra o "me avise" (grava em `leads`
#             com interesse = chave do produto)
#   oculto    não aparece em lugar nenhum; a rota responde 404 até ligar
#
# Links já entregues (com `token`) abrem sempre, qualquer que seja o estado: quem
# comprou antes continua lendo. O webhook da Cakto também não olha para cá.
#
# Preço e link de checkout NÃO ficam aqui: conteudo/ocidental/ofertas.yaml
# (`oferta` = a chave do produto lá).
#
# KIT (rodada 20): um produto com `inclui: [chaves]` é um pacote (sem rota nem página;
# `entrada` = onde a compra começa). Ele só se vende com ele mesmo ativo e TODOS os que
# inclui à venda (catalogo.vende): ligar o kit no painel com um dos três oculto não
# mostra o kit em lugar nenhum e o checkout dele recusa. Ver docs/kit.md.

# INTERRUPTOR DE VENDA (decisão do Nicolas, 5/out). Com `false`: nenhuma página
# nem e-mail mostra preço, botão de compra ou link da Cakto; o desbloqueio da
# amostra vira "me avise"; lembrete, carrinho abandonado, boas-vindas e a oferta
# do pós-compra ficam parados. Com `true`, tudo volta como antes.
# Aberta em 16/out/2026 (rodada 16, decisão do Nicolas): o mapa natal à venda por R$47,
# com a revisão da Dona Valderez acontecendo ao mesmo tempo (o selo de revisado continua
# só nos textos com `revisado: true`).
vendas_abertas: true

# Na ordem em que aparecem (menu, home, "Todas as leituras").
produtos:
  - chave: mapa
    nome: Mapa natal
    rota: /mapa
    estado: ativo
    oferta: mapa
    resumo: "O céu de quando você nasceu: 10 dimensões, roda e PDF."
    vaga: capa-mapa

  # Rodada 13 (15/out/2026): "O seu ano", a previsão dos próximos 12 meses. OCULTO até o
  # Nicolas decidir o preço e ligar (a rota responde 404; links com token abrem sempre).
  # Ligar = trocar o estado para `ativo` (e pôr o preço e o checkout em ofertas.yaml).
  - chave: previsao
    nome: O seu ano
    rota: /seu-ano
    estado: oculto
    oferta: previsao
    resumo: "Os temas e as janelas dos seus próximos 12 meses, a partir do seu mapa natal."
    vaga: capa-mapa

  # Rodada 14 (19/out/2026): "A sua Lua no ano", o calendário lunar personalizado. OCULTO
  # (a rota responde 404; links com token abrem sempre). Rodada 20: com oferta (R$47 no
  # ofertas.yaml, checkout só pela Stripe). Ligar = trocar o estado no /painel.
  - chave: calendario
    nome: A sua Lua no ano
    rota: /calendario-lunar
    estado: oculto
    oferta: calendario
    resumo: "Luas novas e cheias, eclipses, Mercúrio retrógrado e as suas Revoluções Lunares, no seu mapa."
    vaga: capa-mapa

  # Rodada 20 (19/out/2026): o KIT, os três num pagamento só (R$97 no ofertas.yaml). Um
  # kit é um produto com `inclui`: não tem rota nem página própria (`entrada` é a página
  # onde a compra começa, para os botões da /links e de "Todas as leituras") e não entra
  # no menu, na home, no rodapé nem no sitemap. A TRAVA: catalogo.vende("kit") só é
  # verdadeiro com o próprio kit ativo E os três que ele inclui à venda (e com a Stripe).
  # Assim, ligar o kit no /painel sem os três ativos não mostra nada nem abre o checkout.
  - chave: kit
    nome: "Os três: mapa, O seu ano e a sua Lua"
    estado: oculto
    oferta: kit
    inclui: [mapa, previsao, calendario]
    entrada: /mapa
    resumo: "O mapa natal completo, O seu ano e a sua Lua no ano, num pagamento só."
    vaga: capa-mapa

  - chave: compat
    nome: Sinastria do casal
    # A tela do pacote usa /sinastria; a rota que existe (e que já foi compartilhada)
    # continua sendo /compatibilidade.
    rota: /compatibilidade
    estado: em_breve
    oferta: compat
    resumo: Os mapas de vocês dois juntos.
    vaga: capa-amor

  - chave: numerologia
    nome: Numerologia
    rota: /numerologia
    estado: em_breve
    oferta: numerologia
    resumo: Os números do seu nome e da sua data.
    vaga: capa-numerologia

  - chave: tarot
    nome: Tarot
    rota: /tarot
    estado: em_breve
    oferta: tarot
    resumo: Três cartas para pensar no agora.
    vaga: capa-tarot

  - chave: comunidade
    nome: Comunidade
    rota: /comunidade
    estado: oculto
    resumo: Encontros e conversas sobre astrologia com a Dona Valderez.
    vaga: capa-comunidade

  - chave: cursos
    nome: Cursos
    rota: /cursos
    estado: oculto
    resumo: Cursos de astrologia com a Dona Valderez.
    vaga: capa-curso

  - chave: astrologia-do-zero
    nome: Astrologia do zero
    rota: /cursos/astrologia-do-zero
    estado: oculto
    resumo: O curso para aprender a ler um mapa natal desde o começo.
    vaga: capa-curso

  - chave: consulta
    nome: Consulta
    rota: /consulta
    estado: oculto
    resumo: Uma conversa com a Dona Valderez sobre o seu mapa.
    vaga: capa-consulta

# As dimensões do mapa natal, na ordem da amostra. `ponto` é a chave do motor
# (mapa_ocidental.py); `vaga`, a ilustração. As `em_breve` aparecem com cadeado.
dimensoes_mapa:
  - {chave: essencia, nome: Essência, ponto: sol, rotulo: Sol, estado: ativo, vaga: dim-sol,
     descricao: "Quem você é e o que te dá energia."}
  - {chave: emocoes, nome: Emoções, ponto: lua, rotulo: Lua, estado: ativo, vaga: dim-lua,
     descricao: "O que você sente e o que te acolhe."}
  - {chave: como-voce-chega, nome: Como você chega, ponto: ascendente, rotulo: Ascendente, estado: ativo, vaga: dim-asc,
     descricao: "A primeira impressão e o jeito de começar."}
  - {chave: mente, nome: Mente, ponto: mercurio, rotulo: Mercúrio, estado: ativo, vaga: dim-merc,
     descricao: "Como você pensa, aprende e conversa."}
  - {chave: amor, nome: Amor, ponto: venus, rotulo: Vênus, estado: ativo, vaga: dim-venus,
     descricao: "O que você valoriza nos afetos."}
  - {chave: acao, nome: Ação, ponto: marte, rotulo: Marte, estado: ativo, vaga: dim-marte,
     descricao: "Sua coragem e como vai atrás do que quer."}
  - {chave: carreira, nome: Carreira, rotulo: Casa 10 e regente, estado: ativo, vaga: dim-carreira,
     descricao: "Vocação e como você se destaca."}
  - {chave: dinheiro, nome: Dinheiro, rotulo: Casa 2 e Júpiter, estado: ativo, vaga: dim-dinheiro,
     descricao: "Sua relação com segurança e recursos."}
  - {chave: familia, nome: Família, rotulo: Casa 4 e Lua, estado: ativo, vaga: dim-familia,
     descricao: "Raízes, casa e herança afetiva."}
  - {chave: proposito, nome: Propósito, rotulo: Nodo Norte, estado: ativo, vaga: dim-proposito,
     descricao: "O caminho que pede para crescer."}

# Na amostra, a dimensão em breve diz isto (a tela do pacote 2.0).
dimensao_em_breve:
  titulo: Chega em breve no seu mapa
  texto: Quem tem o mapa completo recebe sem pagar de novo.

# Texto do "me avise" (a mesma caixa no mapa natal com a venda fechada e nas
# páginas `em_breve`). {produto} = o nome do produto, em minúsculas.
me_avise:
  eyebrow: Abre em breve
  titulo_venda_fechada: A leitura completa abre em breve
  titulo: Me avise quando abrir
  texto: Um e-mail no dia do lançamento, com a condição de quem pediu para ser avisado.
  aceita_email: "Quero receber o aviso do lançamento por e-mail: {produto}."
  aceita_whatsapp: Também quero o aviso pelo WhatsApp.
  ajuda_whatsapp: Com DDD. Só mandamos mensagem se você marcar a caixa abaixo.
  botao: Me avise
  pronto_titulo: Pronto, avisamos você.
  pronto_texto: Assim que abrir, você recebe o aviso no seu e-mail.
  miudo: Usamos seus dados só para o aviso e as novidades da Valderez Astrologia. Você sai quando quiser.

# Página de cada produto `em_breve` (até a Fase C trazer o modelo completo).
em_breve:
  eyebrow: Em breve
  enquanto_isso: Enquanto isso, veja o seu mapa natal grátis.

# Rodada 20: a copy do KIT (os três num pagamento só), nas amostras do mapa, de "O seu
# ano" e do calendário, na /links e em "Todas as leituras". O preço ("de R$141 por R$97")
# vem do ofertas.yaml; aqui só as palavras. Sem "promoção", sem contador, sem prazo.
kit:
  # embaixo do botão "Desbloquear por R$47" das três amostras (usa os dados já digitados)
  opcao_titulo: "Leve os três por"
  opcao_texto: "o mapa completo, O seu ano e a sua Lua no ano"
  opcao_botao: "Quero os três"
  opcao_miudo: "Um pagamento só, com os dados que você já digitou. Os três links chegam juntos no seu e-mail."
  # a /links e o cartão de "Todas as leituras" (os dois levam ao /mapa, onde a compra começa)
  links_titulo: "Os três: mapa, O seu ano e a sua Lua"
  links_linha: "três leituras num pagamento só"
  leituras_botao: "Começar pelo mapa grátis"

leituras:
  titulo: Todas as leituras
  sub: Comece pelo mapa natal, com amostra grátis. As outras leituras abrem aos poucos; peça para ser avisado.
  rotulo_ativo: Disponível
  rotulo_em_breve: Em breve
  botao_ativo: Ver meu mapa grátis
  botao_em_breve: Me avise quando abrir
